{% extends "base.html" %}

{% block title %}Новий пароль{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-box">
        <h1>Встановлення нового пароля</h1>

        <form id="resetPasswordForm" class="profile-form" data-token="{{ token }}">
            <label for="resetPassword1">Новий пароль</label>
            <input type="password" id="resetPassword1" required>

            <label for="resetPassword2">Повторіть пароль</label>
            <input type="password" id="resetPassword2" required>

            <button type="submit" class="btn btn-primary">Зберегти новий пароль</button>
            <p id="resetPasswordResult" class="form-result"></p>
        </form>
    </div>
</section>
{% endblock %}
{% block scripts %}
<script defer src="{{ url_for('static', filename='js/reset-password.js') }}"></script>
{% endblock %}
